<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Public/images/Human Error.png">
    <title>Code Compiler - Online IDE</title>

    <!-- CSS Files -->
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css'>
    <link rel="stylesheet" href="/CSS/vscode-theme.css">
    <link rel="stylesheet" href="/CSS/animated-background.css">
    <link rel="stylesheet" href="/CSS/button-animations.css">

    <style>
        /* Override for specific layout */
        body {
            background: #1e1e1e;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100%;
            flex-direction: column;
        }

        .content-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .editor-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .file-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }

        .file-tab {
            padding: 8px 16px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .file-tab:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .file-tab.active {
            background-color: var(--bg-primary);
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .divider {
            width: 1px;
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background-color 0.3s ease;
        }

        .divider:hover {
            background-color: var(--accent-blue);
        }

        .status-bar {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            height: 25px;
            align-items: center;
        }

        .status-item {
            display: flex;
            gap: 16px;
        }

        /* Language Icons */
        .lang-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-right: 8px;
        }

        .lang-c {
            background: linear-gradient(135deg, #007acc, #0066aa);
        }

        .lang-cpp {
            background: linear-gradient(135deg, #00599c, #00477a);
        }

        .lang-python {
            background: linear-gradient(135deg, #3776ab, #2a5aa0);
        }

        .lang-java {
            background: linear-gradient(135deg, #f89820, #e67e22);
        }

        .lang-js {
            background: linear-gradient(135deg, #f7df1e, #d4af37);
        }

        .output-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
            flex-direction: column;
            gap: 10px;
        }

        .output-empty i {
            font-size: 32px;
            opacity: 0.5;
        }

        /* Animations for new content */
        .code-line {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .navbar-actions {
                gap: 8px;
            }

            .button-group {
                gap: 6px;
            }

            .btn-run, .btn-compile, .btn-download, .btn-share {
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .content-area {
                flex-direction: column;
            }

            .editor-panel, .output-panel {
                border: none;
            }

            .editor-panel {
                border-bottom: 1px solid var(--border-color);
                flex: 0.5;
            }

            .output-panel {
                flex: 0.5;
            }

            .sidebar-vscode {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="floating-object obj1"></div>
        <div class="floating-object obj2"></div>
        <div class="floating-object obj3"></div>
        <div class="floating-object obj4"></div>
        <div class="floating-object obj5"></div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Navigation Bar -->
        <div class="navbar-vscode">
            <div class="navbar-brand">
                <i class='bx bx-code-alt'></i>
                <span>Code Compiler IDE</span>
            </div>

            <div class="navbar-actions">
                <select id="languageSelector" class="language-selector" onchange="changeLanguage(this.value)">
                    <option value="c" selected>C</option>
                    <option value="cpp">C++</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML/CSS</option>
                </select>

                <button class="navbar-btn" onclick="toggleTheme()" title="Toggle Theme">
                    <i class='bx bx-moon'></i>
                </button>

                <button class="navbar-btn" onclick="openSettings()" title="Settings">
                    <i class='bx bx-cog'></i>
                </button>

                <a href="/Account/Dashboard" class="navbar-btn primary">
                    <i class='bx bxs-dashboard'></i> Dashboard
                </a>

                <button class="navbar-btn" onclick="logout()" title="Logout">
                    <i class='bx bx-log-out'></i> Logout
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content-area">
            <!-- Sidebar -->
            <div class="sidebar-vscode">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Files</p>
                    <a href="#" class="sidebar-item active">
                        <i class='bx bx-file-blank'></i>
                        <span>main.cpp</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class='bx bx-file-blank'></i>
                        <span>header.h</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Navigation</p>
                    <a href="/" class="sidebar-item">
                        <i class='bx bx-code-alt'></i>
                        <span>Code Editor</span>
                    </a>
                    <a href="/Account/Dashboard" class="sidebar-item">
                        <i class='bx bxs-dashboard'></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/classroom" class="sidebar-item">
                        <i class='bx bx-book'></i>
                        <span>Classroom</span>
                    </a>
                    <a href="/snippets" class="sidebar-item">
                        <i class='bx bx-collection'></i>
                        <span>Snippets</span>
                    </a>
                    <a href="/projects" class="sidebar-item">
                        <i class='bx bx-folder'></i>
                        <span>Projects</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Tools</p>
                    <a href="/theme" class="sidebar-item">
                        <i class='bx bx-palette'></i>
                        <span>Themes</span>
                    </a>
                    <a href="/extension" class="sidebar-item">
                        <i class='bx bx-extension'></i>
                        <span>Extensions</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Resources</p>
                    <a href="/other/contactUs.html" class="sidebar-item">
                        <i class='bx bx-envelope'></i>
                        <span>Contact</span>
                    </a>
                    <a href="/feedback" class="sidebar-item">
                        <i class='bx bx-message-detail'></i>
                        <span>Feedback</span>
                    </a>
                </div>
            </div>

            <!-- Editor Panel -->
            <div class="editor-panel" style="flex: 1;">
                <div class="editor-header">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span id="currentFile">main.cpp</span>
                        <span style="color: var(--text-secondary); font-size: 11px;">
                            <i class='bx bx-circle' style="color: #4ec9b0; font-size: 8px;"></i> Modified
                        </span>
                    </div>
                    <span id="lineInfo" style="color: var(--text-secondary); font-size: 11px;">
                        Ln 1, Col 1
                    </span>
                </div>

                <div class="editor-container">
                    <div class="line-numbers" id="lineNumbers"></div>
                    <textarea 
                        class="editor-textarea" 
                        id="codeEditor"
                        placeholder="Write your code here...&#10;&#10;#include&lt;stdio.h&gt;&#10;int main() {&#10;    printf(&quot;Hello, World!&quot;);&#10;    return 0;&#10;}"
                        onkeyup="updateLineNumbers(); updateCursor()"
                        oninput="updateLineNumbers()">
#include&lt;stdio.h&gt;
int main() {
    printf("Hello, World!");
    return 0;
}</textarea>
                </div>

                <div style="background-color: var(--bg-secondary); padding: 12px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 10px;">
                    <div class="button-group">
                        <button class="btn-run pulse-animate" onclick="runCode()" title="Run Code">
                            <i class='bx bx-play'></i> Run
                        </button>
                        <button class="btn-compile" onclick="compileCode()" title="Compile Code">
                            <i class='bx bx-extension'></i> Compile
                        </button>
                        <button class="btn-download" onclick="downloadCode()" title="Download Code">
                            <i class='bx bx-download'></i> Download
                        </button>
                        <button class="btn-share" onclick="shareCode()" title="Share Code">
                            <i class='bx bx-share'></i> Share
                        </button>
                        <button class="btn-icon" onclick="clearEditor()" title="Clear">
                            <i class='bx bx-trash'></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="output-panel">
                <div class="output-header">
                    <span>Output</span>
                    <button class="btn-icon" style="width: 30px; height: 30px; font-size: 14px;" onclick="clearOutput()" title="Clear Output">
                        <i class='bx bx-trash'></i>
                    </button>
                </div>

                <div class="output-container" id="outputPanel">
                    <div class="output-empty">
                        <i class='bx bx-play-circle'></i>
                        <span>Click "Run" to execute your code</span>
                    </div>
                </div>

                <div style="background-color: var(--bg-secondary); padding: 12px 16px; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
                    <small style="color: var(--text-secondary);">Input (Optional):</small>
                    <textarea 
                        class="editor-textarea" 
                        id="inputPanel"
                        placeholder="Provide input for your program here..."
                        style="height: 60px; margin-top: 4px; resize: vertical;"></textarea>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span>UTF-8</span>
                <span id="langStatus">C/C++</span>
                <span id="posStatus">Ln 1, Col 1</span>
            </div>
            <div class="status-item">
                <span>Ready</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/Jquery/jquery.js"></script>

    <script>
        // Initialize line numbers
        function updateLineNumbers() {
            const textarea = document.getElementById('codeEditor');
            const lineCounter = document.getElementById('lineNumbers');
            const lines = textarea.value.split('\n').length;

            let lineNumbers = '';
            for (let i = 1; i <= lines; i++) {
                lineNumbers += i + '.\n';
            }

            lineCounter.textContent = lineNumbers;

            // Sync scroll
            lineCounter.scrollTop = textarea.scrollTop;
        }

        // Update cursor position
        function updateCursor() {
            const textarea = document.getElementById('codeEditor');
            const lines = textarea.value.substring(0, textarea.selectionStart).split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;

            document.getElementById('lineInfo').textContent = `Ln ${line}, Col ${col}`;
            document.getElementById('posStatus').textContent = `Ln ${line}, Col ${col}`;
        }

        // Sync scroll between editor and line numbers
        document.getElementById('codeEditor').addEventListener('scroll', function() {
            document.getElementById('lineNumbers').scrollTop = this.scrollTop;
        });

        // Change language
        function changeLanguage(lang) {
            const editor = document.getElementById('codeEditor');
            const templates = {
                'c': '#include<stdio.h>\nint main() {\n    printf("Hello, World!");\n    return 0;\n}',
                'cpp': '#include<iostream>\nusing namespace std;\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}',
                'python': 'print("Hello, World!")',
                'java': 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}',
                'javascript': 'console.log("Hello, World!");',
                'html': '<!DOCTYPE html>\n<html>\n<head><title>Page</title></head>\n<body><h1>Hello, World!</h1></body>\n</html>'
            };

            editor.value = templates[lang] || '';
            updateLineNumbers();
            updateCursor();

            const langNames = { 'c': 'C/C++', 'cpp': 'C++', 'python': 'Python', 'java': 'Java', 'javascript': 'JavaScript', 'html': 'HTML/CSS' };
            document.getElementById('langStatus').textContent = langNames[lang];
        }

        // Run code
        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const language = document.getElementById('languageSelector').value;
            const input = document.getElementById('inputPanel').value;
            const outputPanel = document.getElementById('outputPanel');

            outputPanel.innerHTML = '<div style="color: var(--text-secondary);">Executing...</div>';

            try {
                const response = await fetch('/api/code-engine/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language, input })
                });

                const result = await response.json();
                
                if (result.success) {
                    const output = result.output || '(No output)';
                    outputPanel.innerHTML = `<div style="color: var(--accent-green); white-space: pre-wrap;">${output.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
                } else {
                    const errorMsg = result.error || 'Unknown error occurred';
                    outputPanel.innerHTML = `<div style="color: var(--accent-red); white-space: pre-wrap;">Error: ${errorMsg}</div>`;
                    if (result.stderr) {
                        outputPanel.innerHTML += `<div style="color: var(--accent-red); white-space: pre-wrap; margin-top: 10px;">STDERR: ${result.stderr}</div>`;
                    }
                }
            } catch (error) {
                outputPanel.innerHTML = `<div style="color: var(--accent-red);">Connection Error: ${error.message}</div>`;
            }
        }

        // Compile code
        async function compileCode() {
            const code = document.getElementById('codeEditor').value;
            const language = document.getElementById('languageSelector').value;
            const outputPanel = document.getElementById('outputPanel');

            outputPanel.innerHTML = '<div style="color: var(--text-secondary);">Compiling...</div>';

            try {
                const response = await fetch('/api/code-engine/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language })
                });

                const result = await response.json();
                
                if (result.success) {
                    outputPanel.innerHTML = `<div style="color: var(--accent-green);">${result.message}</div>`;
                } else {
                    outputPanel.innerHTML = `<div style="color: var(--accent-red);">Compilation Error: ${result.error}</div>`;
                    if (result.stderr) {
                        outputPanel.innerHTML += `<div style="color: var(--accent-red); white-space: pre-wrap; margin-top: 10px;">${result.stderr}</div>`;
                    }
                }
            } catch (error) {
                outputPanel.innerHTML = `<div style="color: var(--accent-red);">Connection Error: ${error.message}</div>`;
            }
        }

        // Download code
        function downloadCode() {
            const code = document.getElementById('codeEditor').value;
            const lang = document.getElementById('languageSelector').value;
            const extensions = { 'c': '.c', 'cpp': '.cpp', 'python': '.py', 'java': '.java', 'javascript': '.js', 'html': '.html' };
            
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'code' + extensions[lang];
            a.click();
        }

        // Share code
        function shareCode() {
            alert('Share functionality coming soon!');
        }

        // Clear editor
        function clearEditor() {
            if (confirm('Clear all code?')) {
                document.getElementById('codeEditor').value = '';
                updateLineNumbers();
                updateCursor();
            }
        }

        // Clear output
        function clearOutput() {
            document.getElementById('outputPanel').innerHTML = '<div class="output-empty"><i class="bx bx-play-circle"></i><span>Click "Run" to execute your code</span></div>';
        }

        // Toggle theme (placeholder)
        function toggleTheme() {
            alert('Theme toggle coming soon!');
        }

        // Open settings
        function openSettings() {
            alert('Settings coming soon!');
        }

        // Logout
        function logout() {
            if (confirm('Logout from compiler?')) {
                window.location.href = '/Account/logout';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateLineNumbers();
            updateCursor();
        });

        // Keyboard shortcuts
        document.getElementById('codeEditor').addEventListener('keydown', function(e) {
            // Tab handling
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;

                this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                updateLineNumbers();
            }

            // Ctrl+Enter to run
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });
    </script>
</body>

</html>
