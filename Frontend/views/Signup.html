<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sign Up | Human Error</title>
        <link rel="stylesheet" href="../Lib/Bootstrap/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/login/util.css">
        <link rel="stylesheet" href="/css/login/main.css">
        <style>
            body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); }
            .signup-container { max-width: 400px; margin: 5vh auto; background: rgba(255,255,255,0.9); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18); padding: 2.5rem 2rem; }
            .form-label { font-weight: 500; }
            .form-control, .form-select { border-radius: 8px; }
            .btn-primary { width: 100%; border-radius: 8px; }
            .text-danger { font-size: 0.95rem; }
        </style>

</head>

<body>

    <div class="signup-container">
        <h2 class="mb-4 text-center">Create Account</h2>
        <form id="signupForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required minlength="3">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" required>
                    <option value="user" selected>User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div id="error-message" class="text-danger mb-2"></div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <div class="mt-3 text-center">
                <a href="/login_1.html">Already have an account? Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = '';
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                return;
            }
            try {
                const res = await fetch('http://localhost:3000/Account/Signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, confirmPassword, role })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user._id || data.user.id,
                        username: data.user.username,
                        role: data.user.role,
                        token: data.token
                    }));
                    window.location.href = '/index.html';
                } else {
                    errorDiv.textContent = data.message || data.error || 'Signup failed.';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>

</html>
