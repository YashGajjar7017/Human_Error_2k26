<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sign Up | Human Error</title>
        <!-- <link rel="stylesheet" href="/CSS/Bootstrap/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="/css/login/util.css">
        <link rel="stylesheet" href="/css/login/main.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
        <link rel="stylesheet" type="text/css" href="/CSS/glassy-login.css">
</head>

<body class="animated-gradient-bg">

    <div class="signup-container">
        <div class="glass-container">
            <h2 class="glass-title">Create Account</h2>
            <form id="signupForm" action="/Account/Signup" method="POST">
                <input class="glass-input" type="text" id="username" name="username" required minlength="3" placeholder="Username" />
                <input class="glass-input" type="email" id="email" name="email" required placeholder="Email" />
                <input class="glass-input" type="password" id="password" name="password" required minlength="8" placeholder="Password" />
                <input class="glass-input" type="password" id="confirmPassword" name="confirmPassword" required minlength="8" placeholder="Confirm Password" />
                <select class="glass-select" id="role" name="role" required>
                    <option value="user" selected>User</option>
                    <option value="admin">Admin</option>
                </select>
                <div id="error-message" class="glass-error"></div>
                <button type="submit" class="glass-button">Sign Up</button>
                <a href="/Account/login" class="glass-link">Already have an account? Login</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const errorDiv = document.getElementById('error-message');

            errorDiv.textContent = '';

            // Client-side validation
            if (!username || username.length < 3) {
                errorDiv.textContent = 'Username must be at least 3 characters.';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters.';
                return;
            }

            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating Account...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/Account/Signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, confirmPassword, role })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Redirect to OTP verification
                    window.location.href = data.redirectUrl || `/Account/sendOTP?email=${encodeURIComponent(email)}`;
                } else {
                    errorDiv.textContent = data.error || 'Signup failed.';
                }
            } catch (err) {
                console.error('Signup error:', err);
                errorDiv.textContent = 'Network error. Please try again.';
            } finally {
                // Reset button state
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
