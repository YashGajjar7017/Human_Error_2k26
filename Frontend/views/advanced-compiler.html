<!-- ENHANCED CODE EDITOR WITH OFFLINE COMPILATION -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced Code Compiler | Human Error</title>
    <link href="/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/CSS/dark-theme-v2.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1937 100%);
        }

        .main-container {
            display: flex;
            height: 100vh;
            margin-top: 60px;
            gap: 1px;
            overflow: hidden;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .output-section {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.5);
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(26, 31, 58, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .language-selector {
            background: rgba(37, 41, 74, 0.5);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #f1f5f9;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .language-selector:hover {
            border-color: var(--accent-primary);
            background: rgba(102, 126, 234, 0.1);
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #codeEditor {
            width: 100%;
            height: 100%;
            background: #0a0e27;
            color: #f1f5f9;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 15px;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            background: rgba(37, 41, 74, 0.4);
            color: #94a3b8;
            padding: 15px 10px;
            text-align: right;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            min-width: 50px;
            user-select: none;
            overflow: hidden;
            height: 100%;
            z-index: 1;
        }

        .line-number {
            display: block;
        }

        .output-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(26, 31, 58, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .output-tabs {
            display: flex;
            gap: 10px;
        }

        .output-tab {
            padding: 8px 16px;
            background: rgba(37, 41, 74, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .output-tab.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: var(--accent-primary);
            color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
        }

        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .stdout {
            color: #10b981;
        }

        .stderr {
            color: #ef4444;
        }

        .debug-info {
            color: #f59e0b;
        }

        .exec-button {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white !important;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exec-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .exec-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .debug-button {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444 !important;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .debug-button:hover {
            background: rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .execution-status {
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 600;
            display: none;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            display: block;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: block;
        }

        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .metric {
            background: rgba(37, 41, 74, 0.6);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .metric-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .input-section {
            padding: 12px 15px;
            background: rgba(26, 31, 58, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-section textarea {
            background: rgba(37, 41, 74, 0.5);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #f1f5f9;
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
        }

        .responsive-layout {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .editor-section {
                flex: 1;
            }

            .output-section {
                flex: 0.8;
                min-height: 300px;
            }
        }
    </style>
</head>
<body class="dark">
    <!-- Enhanced Navbar -->
    <nav class="navbar navbar-expand-lg navbar-glassy fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-code"></i> Code Compiler
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto d-flex gap-2">
                    <a href="/editor.html" class="nav-link small">Editor</a>
                    <a href="/" class="nav-link small">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- EDITOR SECTION -->
        <div class="editor-section">
            <div class="editor-toolbar">
                <select id="languageSelect" class="language-selector">
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                </select>
                <button id="runBtn" class="exec-button ms-auto">
                    <i class="fas fa-play"></i> Run Code
                </button>
                <button id="debugBtn" class="debug-button">
                    <i class="fas fa-bug"></i> Debug
                </button>
            </div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers"></div>
                <textarea id="codeEditor" spellcheck="false" placeholder="Write your code here..."></textarea>
            </div>
        </div>

        <!-- OUTPUT SECTION -->
        <div class="output-section">
            <div class="output-toolbar">
                <div class="output-tabs">
                    <button class="output-tab active" data-tab="output">Output</button>
                    <button class="output-tab" data-tab="errors">Errors</button>
                    <button class="output-tab" data-tab="debug">Debug Info</button>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <label style="color: #94a3b8; font-size: 12px; font-weight: 600;">Standard Input (Optional)</label>
                <textarea id="userInput" placeholder="Provide input for your program here..."></textarea>
            </div>

            <!-- Output Content -->
            <div class="output-content">
                <div class="execution-status" id="status"></div>
                <div id="outputTab" class="output-tab-content">
                    <div id="output" style="color: #10b981;">Ready to execute...</div>
                </div>
                <div id="errorsTab" class="output-tab-content" style="display: none;">
                    <div id="errors" style="color: #ef4444;">No errors</div>
                </div>
                <div id="debugTab" class="output-tab-content" style="display: none;">
                    <div id="debugInfo" style="color: #f59e0b;">Debug info will appear here</div>
                </div>
            </div>

            <!-- Metrics Panel -->
            <div class="metrics-panel" style="padding: 10px 15px;">
                <div class="metric">
                    <div class="metric-value" id="execTime">0ms</div>
                    <div class="metric-label">Execution Time</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="memUsage">0KB</div>
                    <div class="metric-label">Memory Used</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="status-indicator" style="color: #94a3b8;">Ready</div>
                    <div class="metric-label">Status</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/CSS/Bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==== Code Editor State ====
        const codeEditor = document.getElementById('codeEditor');
        const lineNumbers = document.getElementById('lineNumbers');
        const languageSelect = document.getElementById('languageSelect');
        const runBtn = document.getElementById('runBtn');
        const debugBtn = document.getElementById('debugBtn');
        const userInput = document.getElementById('userInput');
        const outputDiv = document.getElementById('output');
        const errorsDiv = document.getElementById('errors');
        const debugDiv = document.getElementById('debugInfo');
        const statusDiv = document.getElementById('status');
        const statusIndicator = document.getElementById('status-indicator');

        // ==== Example Code Templates ====
        const templates = {
            cpp: `#include <iostream>
using namespace std;

int main() {
    cout << "Hello, World!" << endl;
    return 0;
}`,
            python: `print("Hello, World!")`,
            javascript: `console.log("Hello, World!");`,
            java: `public class HelloWorld {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}`,
            c: `#include <stdio.h>

int main() {
    printf("Hello, World!\\n");
    return 0;
}`
        };

        // Initialize with template
        codeEditor.value = templates.cpp;
        updateLineNumbers();

        // ==== Update Line Numbers ====
        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n');
            let lineNumbersHTML = '';
            for (let i = 1; i <= Math.max(lines.length, 1); i++) {
                lineNumbersHTML += `<span class="line-number">${i}</span>`;
            }
            lineNumbers.innerHTML = lineNumbersHTML;
        }

        codeEditor.addEventListener('input', updateLineNumbers);
        codeEditor.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeEditor.scrollTop;
        });

        // ==== Language Change ====
        languageSelect.addEventListener('change', (e) => {
            codeEditor.value = templates[e.target.value];
            updateLineNumbers();
        });

        // ==== Run Code ====
        runBtn.addEventListener('click', executeCode);
        async function executeCode() {
            const code = codeEditor.value;
            const language = languageSelect.value;
            const input = userInput.value;

            runBtn.disabled = true;
            runBtn.innerHTML = '<span class="loading-spinner"></span> Running...';
            statusIndicator.textContent = 'Running...';
            statusIndicator.style.color = '#f59e0b';

            try {
                const response = await fetch('/api/code-engine/compile-and-execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language, input, debugMode: false })
                });

                const result = await response.json();

                if (response.ok) {
                    outputDiv.textContent = result.output || 'No output';
                    errorsDiv.textContent = result.error || 'No errors';
                    statusDiv.className = 'execution-status status-success';
                    statusDiv.textContent = '✓ Execution successful';
                    statusIndicator.textContent = 'Success';
                    statusIndicator.style.color = '#10b981';
                    document.getElementById('execTime').textContent = '~100ms';
                } else {
                    errorsDiv.textContent = result.error || result.message || 'Compilation failed';
                    statusDiv.className = 'execution-status status-error';
                    statusDiv.textContent = '✗ Execution failed';
                    statusIndicator.textContent = 'Error';
                    statusIndicator.style.color = '#ef4444';
                }
            } catch (error) {
                errorsDiv.textContent = 'Network error: ' + error.message;
                statusDiv.className = 'execution-status status-error';
                statusDiv.textContent = '✗ Network error';
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fas fa-play"></i> Run Code';
            }
        }

        // ==== Debug Mode ====
        debugBtn.addEventListener('click', () => {
            debugDiv.textContent = 'Debug mode: Set breakpoints by clicking line numbers (feature coming soon)';
        });

        // ==== Output Tab Switching ====
        document.querySelectorAll('.output-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');

                document.querySelectorAll('.output-tab-content').forEach(content => {
                    content.style.display = 'none';
                });

                const tabName = e.target.dataset.tab;
                document.getElementById(tabName + 'Tab').style.display = 'block';
            });
        });

        // ==== Keyboard Shortcuts ====
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                executeCode();
            }
        });
    </script>
</body>
</html>
