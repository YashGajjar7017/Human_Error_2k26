<script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
<script>
    // --- User/session helpers (replace with real auth integration) ---
    let currentUser = { id: '', role: 'user', token: '', username: 'Guest' };

    // Function to get a specific cookie by name
    function getCookie(name) {
        let cookies = document.cookie.split('; ');
        for (let cookie of cookies) {
            let [key, value] = cookie.split('=');
            if (key === name) return decodeURIComponent(value);
        }
        return null;
    }

    // Simulate getting user from cookies/session (replace with real logic)
    function getCurrentUser() {
        // Try localStorage first (user object and role separately)
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            const role = localStorage.getItem('role') || 'user';
            if (user && user.token) {
                console.log('Login session found in localStorage:', { user, role });
                return { id: '', role, token: user.token, username: user.username };
            }
        } catch (e) {
            console.error('Error parsing user from localStorage:', e);
        }

        // Fallback to cookies
        let username = getCookie('username');
        let token = getCookie('token');
        let role = getCookie('role') || 'user';

        if (username && token) {
            console.log('Login session found in cookies:', { username, token, role });
            return { id: '', role, token, username };
        }
        console.log('No login session found');
        return { id: '', role: 'user', token: '', username: 'Guest' };
    }
    currentUser = getCurrentUser();
    console.log('Current user on classroom page:', currentUser);

    // Update user name in side panel
    function updateUserName() {
        const userNameElement = document.getElementById('user-name');
        const username = currentUser.username || 'Guest';
        console.log('Updating user name to:', username);
        userNameElement.innerText = username;
    }

    // Call immediately to update
    updateUserName();

    // --- Classroom API integration ---

    // Get classroomId or token from URL (e.g., ?id=... or ?token=...)
    function getClassroomIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }
    function getClassroomTokenFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('token');
    }
    const classroomId = getClassroomIdFromUrl();
    const classroomToken = getClassroomTokenFromUrl();

    async function fetchClassroom() {
        if (!classroomId) return;
        const res = await fetch(`/api/classrooms/${classroomId}`, {
            headers: { 'Authorization': `Bearer ${currentUser.token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.classroom) {
            document.getElementById('classroom-token').innerText = data.classroom.shareCode || 'N/A';
            renderMembers(data.classroom);
            if (currentUser.role === 'admin') {
                document.getElementById('admin-actions').style.display = 'block';
            }
        }
    }

    function renderMembers(classroom) {
        const ul = document.getElementById('member-list');
        ul.innerHTML = '';
        if (classroom.instructor) {
            ul.innerHTML += `<li class="member-item" style="background:rgba(0,123,255,0.1); color:#007bff; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.98rem;">${classroom.instructor.username} <span class="admin-badge" style="background:#007bff; color:#fff; border-radius:4px; padding:0.1rem 0.5rem; font-size:0.8rem; margin-left:0.5rem;">Admin</span></li>`;
        }
        if (classroom.students && classroom.students.length) {
            classroom.students.forEach(s => {
                ul.innerHTML += `<li class="member-item" style="background:rgba(0,123,255,0.1); color:#007bff; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.98rem;">${s.username || s.email}</li>`;
            });
        }
    }

    // Copy classroom token
    function copyToken() {
        const token = document.getElementById('classroom-token').innerText;
        navigator.clipboard.writeText(token);
        alert('Classroom token copied!');
    }

    // Join classroom by token
    async function joinClassroom() {
        const token = document.getElementById('join-token').value.trim();
        if (!token) return alert('Please enter a classroom code/token.');
        if (!currentUser.token) return alert('You must be logged in.');
        const res = await fetch(`/api/classrooms/join/${token}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${currentUser.token}` }
        });
        const data = await res.json();
        if (res.ok && data.classroomId) {
            alert('Joined classroom! Redirecting...');
            window.location.href = `classroom.html?id=${data.classroomId}`;
        } else {
            alert(data.error || 'Failed to join classroom');
        }
    }

    // Add member (admin only)
    async function addMember() {
        const studentId = document.getElementById('add-member-id').value.trim();
        if (!studentId) return alert('Enter user ID to add.');
        if (!currentUser.token) return alert('You must be logged in.');
        const res = await fetch('/api/classrooms/add-student', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentUser.token}`
            },
            body: JSON.stringify({ classroomId, studentId })
        });
        const data = await res.json();
        if (res.ok) {
            alert('Member added!');
            fetchClassroom();
        } else {
            alert(data.error || 'Failed to add member');
        }
    }

    // On page load

    window.onload = async function() {
        updateUserName();
        // If ?token=... is present, auto-join and redirect
        if (classroomToken && currentUser.token) {
            const res = await fetch(`/api/classrooms/join/${classroomToken}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${currentUser.token}` }
            });
            const data = await res.json();
            if (res.ok && data.classroomId) {
                window.location.href = `classroom.html?id=${data.classroomId}`;
                return;
            } else {
                alert(data.error || 'Failed to join classroom');
            }
        }
        fetchClassroom();
    };

    // --- WebRTC Real-time Coding (Demo Only) ---
    let peer;
    let isAdmin = currentUser.role === 'admin';
    function setupPeer() {
        peer = new SimplePeer({ initiator: isAdmin, trickle: false });
        peer.on('signal', data => {
            // Send signal data to server/other peer
            // For demo, just log
            console.log('SIGNAL', JSON.stringify(data));
        });
        peer.on('connect', () => {
            document.getElementById('editor').disabled = false;
        });
        peer.on('data', data => {
            document.getElementById('editor').value = data.toString();
        });
    }
    setupPeer();
    // Sync editor changes
    document.getElementById('editor').addEventListener('input', function() {
        if (peer && peer.connected) {
            peer.send(this.value);
        }
    });
    // Disable editor if not connected
    document.getElementById('editor').disabled = true;
</script>
