<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Human Error</title>
    <link rel="stylesheet" type="text/css" href="/CSS/glassy-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Additional styles for OTP page */
        .otp-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .otp-glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37),
                0 0 15px 2px rgba(102, 126, 234, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .otp-glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .otp-glass-container:hover {
            box-shadow: 0 12px 42px 0 rgba(31, 38, 135, 0.5),
                0 0 25px 4px rgba(118, 75, 162, 0.6);
            transform: translateY(-2px);
        }

        .otp-icon {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.8));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .otp-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1.2px;
            text-shadow: 0 2px 8px rgba(102, 126, 234, 0.8);
        }

        .otp-subtitle {
            font-size: 1.1rem;
            color: #e0e0ff;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .email-input-container {
            margin-bottom: 30px;
        }

        .email-input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 1rem;
            box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.1),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .email-input::placeholder {
            color: #ddd;
            opacity: 0.8;
        }

        .email-input:focus {
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.15),
                inset -2px -2px 8px rgba(0, 0, 0, 0.3),
                0 0 0 2px rgba(102, 126, 234, 0.5);
            color: #ffffff;
        }

        .otp-inputs-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.1),
                inset -2px -2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .otp-input:focus {
            background: rgba(255, 255, 255, 0.4);
            outline: none;
            box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.15),
                inset -2px -2px 8px rgba(0, 0, 0, 0.3),
                0 0 0 2px rgba(102, 126, 234, 0.6);
            transform: scale(1.05);
        }

        .otp-input.filled {
            background: rgba(102, 126, 234, 0.3);
            box-shadow: inset 2px 2px 6px rgba(102, 126, 234, 0.2),
                inset -2px -2px 6px rgba(0, 0, 0, 0.3);
        }

        .otp-button {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.7);
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .otp-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .otp-button:hover::before {
            left: 100%;
        }

        .otp-button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            box-shadow: 0 12px 30px rgba(118, 75, 162, 0.8);
            transform: translateY(-2px);
        }

        .otp-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .otp-button:disabled:hover {
            transform: none;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.7);
        }

        .resend-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .resend-text {
            color: #e0e0ff;
            font-size: 0.95rem;
        }

        .resend-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .resend-link:hover {
            color: #ffffff;
            background: rgba(102, 126, 234, 0.2);
            text-decoration: none;
        }

        .resend-link:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        .success-message {
            color: #4ecdc4;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .otp-glass-container {
                padding: 40px 30px;
                margin: 20px;
            }

            .otp-title {
                font-size: 2rem;
            }

            .otp-inputs-container {
                gap: 8px;
            }

            .otp-input {
                width: 45px;
                height: 55px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .otp-inputs-container {
                gap: 6px;
            }

            .otp-input {
                width: 40px;
                height: 50px;
                font-size: 1.3rem;
            }
        }

        /* Loading animation */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <div class="otp-glass-container">
            <div class="otp-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1 class="otp-title">Verify Your Email</h1>
            <p class="otp-subtitle">Enter the 6-digit code sent to your email</p>

            <form id="otpForm">
                <div class="email-input-container">
                    <input type="email" id="email" class="email-input" placeholder="Enter your email address" required>
                </div>

                <div class="otp-inputs-container">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <button type="submit" id="verifyBtn" class="otp-button">
                    <i class="fas fa-check-circle"></i> Verify OTP
                </button>

                <div class="resend-container">
                    <span class="resend-text">Didn't receive the code?</span>
                    <a href="#" id="resendLink" class="resend-link">Resend OTP</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Get email from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const emailFromUrl = urlParams.get('email');

        const inputs = document.querySelectorAll('.otp-input');
        const emailInput = document.getElementById('email');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendLink = document.getElementById('resendLink');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        let resendTimer = null;
        let resendCountdown = 30;

        // Pre-fill email if available
        if (emailFromUrl) {
            emailInput.value = emailFromUrl;
        }

        // Auto-focus first input when email is filled
        emailInput.addEventListener('input', function() {
            if (this.value.length > 0) {
                inputs[0].focus();
            }
        });

        // Handle OTP input navigation
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;

                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Add filled class for styling
                if (value.length === 1) {
                    e.target.classList.add('filled');

                    // Auto-focus next input
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    e.target.classList.remove('filled');
                }

                // Clear messages
                hideMessages();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                    inputs[index - 1].classList.remove('filled');
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const pasteArray = paste.replace(/\D/g, '').split('').slice(0, 6);

                pasteArray.forEach((digit, i) => {
                    if (inputs[i]) {
                        inputs[i].value = digit;
                        inputs[i].classList.add('filled');
                    }
                });

                // Focus the next empty input or the last input
                const nextEmptyIndex = pasteArray.length < 6 ? pasteArray.length : 5;
                if (inputs[nextEmptyIndex]) {
                    inputs[nextEmptyIndex].focus();
                }
            });
        });

        // Handle form submission
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const otp = Array.from(inputs).map(input => input.value).join('');

            // Clear previous messages
            hideMessages();

            // Validation
            if (!email) {
                showError('Please enter your email address');
                emailInput.focus();
                return;
            }

            if (otp.length !== 6) {
                showError('Please enter the complete 6-digit OTP');
                // Focus first empty input
                const firstEmpty = Array.from(inputs).find(input => !input.value);
                if (firstEmpty) firstEmpty.focus();
                return;
            }

            // Show loading state
            setLoadingState(true);

            try {
                const response = await fetch('/Account/verifyOTP', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        otp1: inputs[0].value,
                        otp2: inputs[1].value,
                        otp3: inputs[2].value,
                        otp4: inputs[3].value,
                        otp5: inputs[4].value,
                        otp6: inputs[5].value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('OTP verified successfully! Redirecting...');

                    // Store tokens and redirect to dashboard
                    if (data.data && data.data.accessToken) {
                        localStorage.setItem('accessToken', data.data.accessToken);
                        localStorage.setItem('refreshToken', data.data.refreshToken);
                        localStorage.setItem('user', JSON.stringify({
                            username: data.data.username,
                            email: data.data.email,
                            userId: data.data.userId
                        }));
                    }

                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = data.redirectUrl || '/index.html';
                    }, 1500);
                } else {
                    showError(data.error || 'OTP verification failed');
                    // Clear OTP inputs on error
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    inputs[0].focus();
                }
            } catch (error) {
                console.error('OTP verification error:', error);
                showError('Network error. Please try again.');
            } finally {
                setLoadingState(false);
            }
        });

        // Handle resend OTP
        resendLink.addEventListener('click', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showError('Please enter your email address first');
                emailInput.focus();
                return;
            }

            // Show loading state
            resendLink.textContent = 'Sending...';
            resendLink.style.pointerEvents = 'none';

            try {
                const response = await fetch('/Account/sendOTP', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('OTP sent successfully! Check your email.');
                    startResendTimer();
                } else {
                    showError(data.error || 'Failed to send OTP');
                }
            } catch (error) {
                console.error('Send OTP error:', error);
                showError('Network error. Please try again.');
            } finally {
                if (!resendTimer) {
                    resendLink.textContent = 'Resend OTP';
                    resendLink.style.pointerEvents = 'auto';
                }
            }
        });

        // Utility functions
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            successDiv.classList.remove('show');
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.add('show');
            errorDiv.classList.remove('show');
        }

        function hideMessages() {
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
        }

        function setLoadingState(loading) {
            verifyBtn.disabled = loading;
            if (loading) {
                verifyBtn.innerHTML = '<span class="loading-dots">Verifying</span>';
            } else {
                verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP';
            }
        }

        function startResendTimer() {
            resendCountdown = 30;
            resendLink.textContent = `Resend in ${resendCountdown}s`;
            resendLink.style.pointerEvents = 'none';
            resendLink.classList.add('disabled');

            resendTimer = setInterval(() => {
                resendCountdown--;
                resendLink.textContent = `Resend in ${resendCountdown}s`;

                if (resendCountdown <= 0) {
                    clearInterval(resendTimer);
                    resendTimer = null;
                    resendLink.textContent = 'Resend OTP';
                    resendLink.style.pointerEvents = 'auto';
                    resendLink.classList.remove('disabled');
                }
            }, 1000);
        }

        // Auto-focus first input on page load if email is pre-filled
        if (emailFromUrl) {
            setTimeout(() => inputs[0].focus(), 500);
        } else {
            emailInput.focus();
        }
    </script>
</body>
</html>
