<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Error - Desktop App</title>
    <meta
      name="description"
      content="Modern desktop application for code compilation and learning"
    />
    <style>
      /* Animated Gradient Background */
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
        }
        
        @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
        }
        
        @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        }
        
        @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
        }
        
        @keyframes scaleIn {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
        }
        
        @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
        }
        
        @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-30px);
        }
        60% {
          transform: translateY(-15px);
        }
        }
        
        @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
        }
        
        /* Loading Screen Styles */
        #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(-45deg, #667eea, #764ba2, #f5f7fa, #c3cfe2);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        }
        
        .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 30px;
        animation: float 3s ease-in-out infinite, scaleIn 0.8s ease-out;
        }
        
        .loading-logo svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 10px 20px rgba(102, 126, 234, 0.3));
        }
        
        .loading-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 700;
        color: white;
        margin-bottom: 10px;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .loading-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 40px;
        animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite, fadeInUp 0.8s ease-out 0.6s both;
        }
        
        .loading-progress {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin-top: 30px;
        overflow: hidden;
        animation: fadeInUp 0.8s ease-out 0.8s both;
        }
        
        .loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, transparent, white, transparent);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 2px;
        }
        
        .loading-particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        }
        
        .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
        }
        
        .particle:nth-child(1) {
        left: 10%;
        top: 20%;
        animation-delay: 0s;
        width: 8px;
        height: 8px;
        }
        
        .particle:nth-child(2) {
        left: 20%;
        top: 60%;
        animation-delay: 1s;
        width: 12px;
        height: 12px;
        }
        
        .particle:nth-child(3) {
        left: 35%;
        top: 40%;
        animation-delay: 2s;
        width: 6px;
        height: 6px;
        }
        
        .particle:nth-child(4) {
        left: 50%;
        top: 80%;
        animation-delay: 3s;
        width: 10px;
        height: 10px;
        }
        
        .particle:nth-child(5) {
        left: 65%;
        top: 30%;
        animation-delay: 4s;
        width: 8px;
        height: 8px;
        }
        
        .particle:nth-child(6) {
        left: 80%;
        top: 70%;
        animation-delay: 5s;
        width: 12px;
        height: 12px;
        }
        
        .particle:nth-child(7) {
        left: 90%;
        top: 50%;
        animation-delay: 1.5s;
        width: 6px;
        height: 6px;
        }
        
        .particle:nth-child(8) {
        left: 15%;
        top: 85%;
        animation-delay: 2.5s;
        width: 10px;
        height: 10px;
        }
        
        .particle:nth-child(9) {
        left: 75%;
        top: 15%;
        animation-delay: 3.5s;
        width: 8px;
        height: 8px;
        }
        
        .particle:nth-child(10) {
        left: 55%;
        top: 55%;
        animation-delay: 4.5s;
        width: 12px;
        height: 12px;
        }
        
        /* App Container Animation */
        #root {
        opacity: 0;
        animation: fadeInUp 0.5s ease-out 0.3s both;
        }
        
        #root.loaded {
        opacity: 1;
        }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>
      
      <div class="loading-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea"/>
              <stop offset="100%" style="stop-color:#764ba2"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" filter="url(#glow)"/>
          <text x="50" y="60" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Arial, sans-serif">HE</text>
        </svg>
      </div>
      
      <h1 class="loading-title">Human Error</h1>
      <p class="loading-subtitle">Code Compilation & Learning</p>
      
      <div class="loading-spinner"></div>
      <div class="loading-progress">
        <div class="loading-progress-bar"></div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          const root = document.getElementById('root');
          
          if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
          }
          
          if (root) {
            root.classList.add('loaded');
          }
          
          // Remove loading screen from DOM after fade
          setTimeout(function() {
            loadingScreen.remove();
          }, 500);
        }, 1500); // Minimum loading time for better UX
      });
    </script>
  </body>
</html>
